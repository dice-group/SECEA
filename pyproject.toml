[project]
name = "secea"
version = "0.1.0"
description = "SECEA: Self Configuring Matcher Framework for Entity and Knowledge Graph Alignment"
requires-python = ">=3.10"
dependencies = [
    "torch==2.6.0+cpu",
    "flask==3.1.3",
    "lightrdf==0.4.0",
    "unidecode==1.4.0",
    "numpy==2.2.6",
]

[tool.uv]
package = false

[[tool.uv.index]]
name = "pytorch-cpu"
url = "https://download.pytorch.org/whl/cpu"
